# Setup
title: Yonghao Yang
description: Nesperados no way back
url: https://4yaka6.github.io
avatar: /avatar.jpeg
paginate: 5
permalink: pretty
cover_image: /bg.jpeg

remote_theme: vszhub/not-pure-poole

# Gems
plugins:
  - jekyll-remote-theme
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/

# Optimize Jekyl SEO Tag
social:
  name: Yonghao Yang
  links:
    - https://github.com/4yaka6
lang: en

sass:
  sass_dir: _sass
  style: :compressed

author:
  name: Yonghao Yang
  url: https://github.com/4yaka6
  email: ayakakinomiya@gmail.com

kramdown:
  input: GFM
  hard_wrap: true
